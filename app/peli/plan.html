        <div><dt>Hora</dt><dd id="c-hora"></dd></div>
        <div><dt>Lugar</dt><dd id="c-lugar"></dd></div>

      <button class="btn si" id="confirmar" type="button">Confirmar</button>
      <p class="aviso" id="aviso" hidden></p>
