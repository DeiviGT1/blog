<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Custodia</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>⚖️</text></svg>">
  <meta property="og:type" content="website">
  <meta property="og:title" content="Custodia">
  <meta property="og:description" content="Caso abierto.">
  <meta name="robots" content="noindex">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./css/style.css">
  <script src="./config.js"></script>
  <script src="./artistas.js"></script>
  <script src="./javascript/app.js" defer></script>
</head>
<body>
  <!-- Portada -->
  <section id="portada" class="pantalla">
    <p class="mono chico" id="p-caso"></p>
    <h1 class="gigante">Custodia</h1>
    <p class="partes"><span class="pa" id="p-a"></span> <em>vs.</em> <span class="pb" id="p-b"></span></p>
    <button class="btn" id="abrir" type="button">Abrir caso</button>
    <button class="link mono chico" id="seguir" type="button" hidden>Continuar donde iban</button>
  </section>

  <!-- Audiencia -->
  <section id="audiencia" class="pantalla" hidden>
    <header class="marcador">
      <div class="lado a"><span class="mono" id="m-a-n"></span><b id="m-a">0</b></div>
      <div class="centro">
        <span class="mono chico" id="m-pos"></span>
        <div class="barra"><i id="m-barra"></i></div>
        <span class="mono chico" id="m-c"></span>
      </div>
      <div class="lado b"><b id="m-b">0</b><span class="mono" id="m-b-n"></span></div>
    </header>

    <div class="mesa" id="mesa"></div>

    <div class="mando">
      <button class="pieza a" id="d-a" type="button" aria-label="A la izquierda"><span>←</span><small id="d-a-n"></small></button>
      <button class="pieza c" id="d-c" type="button"><span>↑</span><small>Compartida</small></button>
      <button class="pieza b" id="d-b" type="button" aria-label="A la derecha"><span>→</span><small id="d-b-n"></small></button>
    </div>
    <div class="extras">
      <button class="mini" id="x-undo" type="button" title="Deshacer">↶</button>
      <button class="mini" id="x-moneda" type="button">Moneda</button>
      <button class="mini" id="x-luego" type="button">Luego</button>
      <button class="mini" id="x-fallo" type="button">Fallo</button>
    </div>
    <div class="moneda" id="moneda" hidden><div class="disco" id="disco"><span class="cara a" id="cara-a"></span><span class="cara b" id="cara-b"></span></div></div>
  </section>

  <!-- Sentencia -->
  <section id="sentencia" class="pantalla" hidden>
    <p class="mono chico">Sentencia</p>
    <h2 class="resultado"><span class="pa" id="s-a">0</span><em>—</em><span class="pb" id="s-b">0</span></h2>
    <p class="mono chico" id="s-c"></p>

    <div class="grupos">
      <div class="grupo a">
        <h3 id="g-a-n"></h3>
        <div class="fichas" id="g-a"></div>
        <div class="salidas">
          <a class="btn chico yt" id="yt-a" target="_blank" rel="noopener">YouTube</a>
          <button class="btn chico hueco" id="sp-a" type="button">Copiar para Spotify</button>
        </div>
      </div>
      <div class="grupo c">
        <h3>Compartida</h3>
        <div class="fichas" id="g-c"></div>
      </div>
      <div class="grupo b">
        <h3 id="g-b-n"></h3>
        <div class="fichas" id="g-b"></div>
        <div class="salidas">
          <a class="btn chico yt" id="yt-b" target="_blank" rel="noopener">YouTube</a>
          <button class="btn chico hueco" id="sp-b" type="button">Copiar para Spotify</button>
        </div>
      </div>
    </div>

    <div class="cierre">
      <button class="link mono chico" id="volver" type="button">Volver a la audiencia</button>
      <button class="link mono chico" id="enlace" type="button">Copiar enlace del fallo</button>
      <button class="link mono chico" id="reiniciar" type="button">Reiniciar caso</button>
    </div>
  </section>

  <div class="toast mono chico" id="toast" hidden></div>
</body>
</html>
